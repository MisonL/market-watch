name: test

# 每次 push 到 main、以及每个 PR，跑单元测试 + 锚点完整性。
#
# ## 为什么 CI 里跑这两项（而不是自检/变异测试）
#
# | 检查 | 耗时 | 进 CI？ | 理由 |
# |---|---|---|---|
# | 单元测试 `run_all.sh` | ~20~40s | ✅ | 快、确定性高、覆盖各层判据 |
# | 锚点完整性 | ~2s | ✅ | **改源码忘了同步变异体锚点时抓得住** |
# | 自检 `selfcheck.py` | 1~3 分钟 | ⚠️ 不跑 | 它检查的是**这台机器**的运行时状态
# | | | | （launchd 任务、日志新鲜度、AI CLI 在位）—— 在 runner 上必然一片红，
# | | | | 而红的原因与代码质量无关 |
# | 变异测试 | 1~2 小时 | ❌ 不跑 | 太慢、且要真跑 selfcheck 子进程 |
#
# 自检和变异测试是**本机发布前**的门槛（见 CONTRIBUTING.md），不是 CI 的活。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # 允许手动触发

jobs:
  test:
    runs-on: ubuntu-latest
    # ⚠️⚠️ 2026-11-19（CI 健壮性）：必须显式设 job 上限。
    #
    # GitHub 的默认上限是 **6 小时**。原先真出现"某个测试挂死"时（等锁、
    # 等网络、死循环），CI 会安静地跑满 6 小时才失败 —— 期间每次 push 都
    # 在排队、日志滚没了、而且没有任何一层说清"卡在哪个测试"。
    #
    # 本 job 正常耗时 **16~25s**（实测 13 次运行），即使 runner 极慢也就
    # 一两分钟。10 分钟是 20 倍余量：目标是抓"挂死"，不是抓"慢"。
    #
    # 与 `tests/run_all.sh` 里的单测试超时（300s）是两层：单测试超时负责
    # 定位到**具体哪个文件**，这里负责兜"整个 job 卡在别处"（编译、
    # checkout、锚点检查）。两层都必要 —— 只有一层时，坏在另一层就抓不到。
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是声明的最低版本（`typing.NotRequired`），
        # 加上最新稳定版，确保两头都过
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 语法检查（全部源码与测试）
        run: |
          python -m compileall -q src tests
          echo "✅ 全部可编译"

      - name: 锚点完整性
        # 379 条变异体的注入锚必须都能在源码里**逐字**找到。
        # 改源码忘了同步锚点 → 全量回归会静默变成"假漏网"，
        # 而这个检查只要 2 秒就能发现。
        run: python tests/test_anchor_integrity.py

      - name: 单元测试
        # ⚠️ MW_TEST_JOBS 刻意设 4：
        #   · 本仓库的 `src/concurrency.py` 会按**实测吞吐**自适应并发，
        #     但 GitHub runner 只有 2~4 核、且是共享的，
        #     自适应在 40 秒的任务里来不及收敛，反而可能开太多把 runner 拖垮
        #   · 显式指定 = 不猜（`resolve_workers` 的约定：环境变量永远优先）
        env:
          MW_TEST_JOBS: "4"
          PYTHONDONTWRITEBYTECODE: "1"
        # ⚠️ `run_all.sh` 的返回码语义（见其文件尾）：
        #     0 = 全过
        #     1 = 有失败（真问题）
        #     2 = 全过但有**跳过**（跳过不算验证过）
        #
        # 这个设计是对的 —— 本机跑时 SKIP 必须让人看见。
        # 但在 CI 里，"跳过"的固定原因是 `agent/.venv` 不存在
        # （`agent/` 是独立仓库、已在本仓库 .gitignore 里，克隆后必然没有），
        # 那是**环境差异不是代码缺陷**，不该让 CI 变红。
        #
        # 所以这里接受 0 和 2，但把跳过数打印出来 —— 不能因为"不让 CI 红"
        # 就把跳过的事实藏掉。rc=1（真失败）仍然让 job 失败。
        run: |
          set +e
          bash tests/run_all.sh | tee /tmp/run_all.out
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "✅ 全部通过"
          elif [ "$rc" -eq 2 ]; then
            echo "::warning::有测试被跳过（CI 环境缺 agent/.venv，属预期）—— 见上方输出"
            # ⚠⚠ 2026-11-18（第一次 CI 实测暴露）：**必须防"全部跳过"**。
            # 首次运行 CI 时解释器被硬编码成 `/usr/local/bin/python3`（macOS
            # 路径），Linux 上不存在 → 48 个测试**全部**跳过，而 rc 仍是 2。
            # 若只判 rc，会得到一个"全绿但什么都没验"的结论。
            # 现在显式要求：通过数必须 > 0，且跳过数不得超过总测试数的一半。
            # 解析汇总行「通过 N / 跳过 M / 失败 K」
            line=$(grep -E '^通过 [0-9]+ / 跳过 [0-9]+ / 失败 [0-9]+' /tmp/run_all.out | tail -1)
            n_ok=$(echo "$line" | sed -E 's|通过 ([0-9]+).*|\1|')
            n_skip=$(echo "$line" | sed -E 's|.*跳过 ([0-9]+).*|\1|')
            n_fail=$(echo "$line" | sed -E 's|.*失败 ([0-9]+).*|\1|')
            # ⚠️ 2026-11-19：原先这里写 `$(( n_ok + n_skip + n_fail ))`，
            # 而 `n_fail` **从未被赋值** —— 变量展开成空串，算术里当 0。
            # 后果：总数偏小。这个缺陷单独看无害（总数只用在下面的
            # "跳过数不得超过一半"判断），但它是个**假变量**：读者会以为
            # 总数算进去了失败数，实际没有。补上解析。
            n_total=$(( ${n_ok:-0} + ${n_skip:-0} + ${n_fail:-0} ))
            echo "通过 ${n_ok:-?} / 跳过 ${n_skip:-?} / 失败 ${n_fail:-?} / 共 $n_total"
            if [ "${n_ok:-0}" -eq 0 ]; then
              echo "::error::一个测试都没真正执行（全部跳过）—— 这不是通过"
              exit 1
            fi
            if [ "${n_skip:-0}" -gt $(( n_total / 2 )) ]; then
              echo "::error::跳过数 ${n_skip} 超过总数 $n_total 的一半 —— 环境有问题"
              exit 1
            fi
          else
            echo "::error::测试失败 rc=$rc"
            exit "$rc"
          fi

      - name: 失败时留档
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python-version }}
          # ⚠️ 2026-11-19：这份留档**建了却从未生效过**。
          # `run_all.sh` 原先从不生成 `tests/*.log`（测试输出只存在它自己的
          # mktemp 目录里，`trap ... EXIT` 会整个删掉），于是 2026-11-18 那次
          # CI 红灯在 GitHub 上是 `artifacts: 0` —— 想查只能翻几百行混在
          # 一起的控制台输出。
          # 现在 `run_all.sh` 只把**失败/超时**那些测试的完整输出写进
          # `tests/<name>.log`（600 权限），这一个步骤才真正有东西可传。
          path: |
            tests/*.log
          if-no-files-found: warn       # 失败却没产物 = 留档机制自己坏了，要说出来
          retention-days: 7
